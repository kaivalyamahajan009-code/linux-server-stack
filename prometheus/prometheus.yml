global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["127.0.0.1:8080"]
