apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 30s

  - name: PostgreSQL
    type: postgres
    uid: postgres
    url: 127.0.0.1:5432
    user: grafana_reader
    database: ${POSTGRES_DB}
    secureJsonData:
      password: ${GF_DATABASE_READER_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1700
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    editable: false
